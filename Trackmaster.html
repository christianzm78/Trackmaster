<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title></title>

<style>

body{
font-family:Arial;
background:#1DB954;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:#191414;
padding:40px;
border-radius:20px;
width:350px;
text-align:center;
}

button{
background:#1DB954;
border:none;
color:white;
padding:15px 30px;
border-radius:50px;
cursor:pointer;
font-size:18px;
}

button:hover{
transform:scale(1.05);
}

</style>

</head>

<body>

<div class="box">

<h1>🎵 TrackMaster</h1>

<p>Song 001</p>

<button>Song starten</button>

<br><br>

<button>Lösung anzeigen</button>

</div>

</body>

</html>
